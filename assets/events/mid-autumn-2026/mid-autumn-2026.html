<script>(function(){
const W=1080,H=1920,DUR=10;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
cv.width=W;cv.height=H;
const sheenC=document.createElement('canvas');sheenC.width=W;sheenC.height=240;
// seeded rng
function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const R=rng(20260925);
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const prog=(t,a,b)=>clamp((t-a)/(b-a));
const eOut=x=>1-Math.pow(1-x,3), eInOut=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eBack=x=>{const c1=1.4,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2);};

const stars=[...Array(260)].map(()=>({x:R()*W,y:R()*H*0.72,r:R()*1.8+0.4,p:R()*6.28,s:R()*2+1}));
const lanterns=[...Array(13)].map((_,i)=>{const sz=0.35+R()*0.6;const side=R()<0.5;const x=sz>0.55?(side?50+R()*260:770+R()*260):80+R()*920;return{x,t0:2.0+R()*3.4,sp:170+R()*120,sz,sw:R()*6.28,amp:12+R()*22};});
lanterns.sort((a,b)=>a.sz-b.sz);
const petals=[...Array(70)].map(()=>({x:R()*W*1.2-60,y0:-60-R()*1400,sp:90+R()*110,rot:R()*6.28,vr:(R()-.5)*3,sw:R()*6.28,sz:5+R()*7,t0:0.6+R()*1.5}));
const craters=[[-80,-90,55,.10],[70,-40,38,.08],[20,90,70,.07],[-110,60,30,.09],[110,110,26,.08],[-20,-150,22,.07]];

function sky(t){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#030820');g.addColorStop(.45,'#0b1845');g.addColorStop(.72,'#1d2a63');g.addColorStop(.82,'#3a3160');g.addColorStop(1,'#0a0f2a');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  for(const s of stars){
    const a=(0.35+0.65*(0.5+0.5*Math.sin(t*s.s+s.p)))*clamp(t/1.2+0.25);
    ctx.globalAlpha=a;ctx.fillStyle='#fff6dd';
    ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,6.283);ctx.fill();
    if(s.r>1.9){ctx.globalAlpha=a*.5;ctx.fillRect(s.x-s.r*3,s.y-.5,s.r*6,1);ctx.fillRect(s.x-.5,s.y-s.r*3,1,s.r*6);}
  }
  ctx.globalAlpha=1;
}
function moonPos(t){const p=eOut(prog(t,0,2.8));return{x:540,y:2150+(640-2150)*p};}
function moon(t){
  const {x,y}=moonPos(t),r=250;
  const pulse=1+0.03*Math.sin(t*2.2);
  // halo
  let g=ctx.createRadialGradient(x,y,r*.8,x,y,r*3.2*pulse);
  g.addColorStop(0,'rgba(255,214,130,0.55)');g.addColorStop(.35,'rgba(255,190,100,0.16)');g.addColorStop(1,'rgba(255,190,100,0)');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // body
  g=ctx.createRadialGradient(x-70,y-80,20,x,y,r);
  g.addColorStop(0,'#fffbe8');g.addColorStop(.55,'#fbe3a1');g.addColorStop(1,'#eab65a');
  ctx.save();ctx.shadowColor='rgba(255,210,120,0.9)';ctx.shadowBlur=90;
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,6.283);ctx.fill();ctx.restore();
  ctx.save();ctx.beginPath();ctx.arc(x,y,r,0,6.283);ctx.clip();
  for(const [cx,cy,cr,a] of craters){
    const cg=ctx.createRadialGradient(x+cx,y+cy,0,x+cx,y+cy,cr);
    cg.addColorStop(0,`rgba(200,140,60,${a})`);cg.addColorStop(1,'rgba(200,140,60,0)');
    ctx.fillStyle=cg;ctx.beginPath();ctx.arc(x+cx,y+cy,cr,0,6.283);ctx.fill();
  }
  // jade rabbit
  const ra=0.2*clamp(prog(t,1.6,3));
  ctx.fillStyle=`rgba(176,112,40,${ra})`;
  ctx.translate(x+30,y+40);
  const el=(ex,ey,rx,ry,rot)=>{ctx.beginPath();ctx.ellipse(ex,ey,rx,ry,rot,0,6.283);ctx.fill();};
  el(10,40,78,56,-.15);el(-62,-10,36,30,.2);el(-78,-72,11,48,-.35);el(-52,-78,11,50,-.05);el(84,34,16,14,0);el(-30,86,30,10,0);el(50,88,30,10,0);
  ctx.restore();
}
function hills(t){
  const layers=[{y:1520,a:60,c:'#141c45',f:.004,o:1.3},{y:1600,a:70,c:'#0d1334',f:.0055,o:3.1},{y:1700,a:50,c:'#070b22',f:.007,o:0.2}];
  for(const L of layers){
    ctx.fillStyle=L.c;ctx.beginPath();ctx.moveTo(0,H);
    for(let x=0;x<=W;x+=10){const yy=L.y-L.a*(0.6*Math.sin(x*L.f+L.o)+0.4*Math.sin(x*L.f*2.3+L.o*2));ctx.lineTo(x,yy);}
    ctx.lineTo(W,H);ctx.fill();
  }
  // lake with moon reflection
  const ly=1760;
  const lg=ctx.createLinearGradient(0,ly,0,H);lg.addColorStop(0,'#0d1640');lg.addColorStop(1,'#040716');
  ctx.fillStyle=lg;ctx.fillRect(0,ly,W,H-ly);
  const m=moonPos(t),vis=clamp(prog(t,1.2,2.8));
  for(let i=0;i<14;i++){
    const yy=ly+10+i*11,w=(170-i*7)*(0.75+0.25*Math.sin(t*3+i*1.7));
    ctx.fillStyle=`rgba(255,215,140,${(0.55-i*0.03)*vis})`;
    ctx.fillRect(m.x-w/2+Math.sin(t*2+i)*12,yy,w,3);
  }
}
function cloud(cx,cy,s,a){
  ctx.save();ctx.translate(cx,cy);ctx.scale(s,s);ctx.globalAlpha=a;
  const g=ctx.createLinearGradient(0,-60,0,40);g.addColorStop(0,'rgba(120,130,190,0.85)');g.addColorStop(1,'rgba(40,50,110,0.9)');
  ctx.fillStyle=g;ctx.beginPath();
  ctx.ellipse(0,0,170,34,0,0,6.283);ctx.ellipse(-70,-22,70,42,0,0,6.283);ctx.ellipse(20,-36,80,52,0,0,6.283);ctx.ellipse(100,-12,60,34,0,0,6.283);
  ctx.fill();
  ctx.strokeStyle='rgba(255,220,150,0.35)';ctx.lineWidth=3;
  ctx.beginPath();ctx.arc(20,-36,50,Math.PI*1.1,Math.PI*1.9);ctx.stroke();
  ctx.beginPath();ctx.arc(-70,-22,40,Math.PI*1.1,Math.PI*1.8);ctx.stroke();
  ctx.restore();
}
function clouds(t){
  const a=clamp(prog(t,.8,2.4));
  cloud(250+t*14,830,1.1,.8*a);
  cloud(900-t*18,700,.9,.7*a);
  cloud(120+t*10,420,.7,.45*a);
}
function lantern(L,t){
  const tt=t-L.t0; if(tt<0)return;
  const x=L.x+Math.sin(tt*0.9+L.sw)*L.amp, y=H+80-tt*L.sp*L.sz, s=L.sz;
  if(y<-200)return;
  const fl=0.85+0.15*Math.sin(t*13+L.sw*5)*Math.sin(t*7+L.sw);
  const fade=clamp(tt/0.6)*clamp((y+100)/500);
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.globalAlpha=fade;
  let g=ctx.createRadialGradient(0,10,5,0,10,160);g.addColorStop(0,`rgba(255,170,60,${0.5*fl})`);g.addColorStop(1,'rgba(255,120,40,0)');
  ctx.fillStyle=g;ctx.fillRect(-160,-150,320,320);
  g=ctx.createLinearGradient(0,-60,0,60);g.addColorStop(0,'#ffcf6b');g.addColorStop(.6,'#ff9a3c');g.addColorStop(1,'#e2582a');
  ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(-40,-50);ctx.quadraticCurveTo(0,-72,40,-50);ctx.quadraticCurveTo(44,10,28,58);ctx.quadraticCurveTo(0,64,-28,58);ctx.quadraticCurveTo(-44,10,-40,-50);ctx.fill();
  ctx.fillStyle=`rgba(255,250,210,${0.75*fl})`;ctx.beginPath();ctx.ellipse(0,38,12,16,0,0,6.283);ctx.fill();
  ctx.strokeStyle='rgba(150,60,20,0.5)';ctx.lineWidth=2;
  for(const k of[-14,14]){ctx.beginPath();ctx.moveTo(k*1.1,-62);ctx.quadraticCurveTo(k*1.3,0,k*.8,60);ctx.stroke();}
  ctx.restore();
}
function flower(x,y,sz,rot,a){
  ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.globalAlpha=a;ctx.fillStyle='#ffc94d';
  for(let k=0;k<4;k++){ctx.rotate(Math.PI/2);ctx.beginPath();ctx.ellipse(0,-sz*.55,sz*.42,sz*.6,0,0,6.283);ctx.fill();}
  ctx.fillStyle='#e8892a';ctx.beginPath();ctx.arc(0,0,sz*.22,0,6.283);ctx.fill();ctx.restore();
}
function petalsDraw(t){
  for(const p of petals){
    const tt=t-p.t0;if(tt<0)continue;
    const y=p.y0+tt*p.sp+400, x=p.x+Math.sin(tt*1.3+p.sw)*40+tt*18;
    if(y<-20||y>H+20)continue;
    flower(x,y,p.sz,p.rot+tt*p.vr,0.85*clamp(tt/0.5));
  }
}
function branch(t){
  const a=eOut(prog(t,.3,1.8));
  ctx.save();ctx.translate(-40,40);ctx.rotate(0.05*Math.sin(t*1.1));ctx.globalAlpha=a;
  ctx.strokeStyle='#2a1a14';ctx.lineWidth=14;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(0,40);ctx.bezierCurveTo(180,60,300,160,470,190);ctx.stroke();
  ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(230,95);ctx.bezierCurveTo(260,180,300,230,330,290);ctx.stroke();
  ctx.beginPath();ctx.moveTo(360,150);ctx.bezierCurveTo(400,110,450,100,500,110);ctx.stroke();
  const leaves=[[120,50,.3],[170,95,2.2],[260,105,.6],[300,170,2.6],[330,290,1.9],[410,160,.9],[470,190,2.9],[500,110,.2],[210,70,-.2],[290,250,.4],[360,140,2.0]];
  for(const [lx,ly,r] of leaves){
    ctx.save();ctx.translate(lx,ly);ctx.rotate(r+0.08*Math.sin(t*1.7+lx));
    const lg=ctx.createLinearGradient(0,0,70,0);lg.addColorStop(0,'#1f4a3a');lg.addColorStop(1,'#2f6b4f');
    ctx.fillStyle=lg;ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(35,-20,75,0);ctx.quadraticCurveTo(35,20,0,0);ctx.fill();ctx.restore();
  }
  const fr=rng(88);
  for(let i=0;i<46;i++){
    const bx=[140,190,250,285,320,380,440,480,220,310][i%10]+fr()*50-25,by=[70,95,110,190,270,150,180,125,80,230][i%10]+fr()*40-20;
    flower(bx,by,7+fr()*4,fr()*6,a);
  }
  ctx.restore();
}
function goldText(txt,x,y,size,weight,alpha,scale,spacing){
  if(alpha<=0)return;
  ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);ctx.globalAlpha=alpha;
  ctx.font=`${weight} ${size}px NSerif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.letterSpacing=(spacing||0)+'px';
  const g=ctx.createLinearGradient(0,-size/2,0,size/2);g.addColorStop(0,'#fff4c8');g.addColorStop(.5,'#f5c865');g.addColorStop(1,'#d9912e');
  ctx.shadowColor='rgba(255,180,80,0.8)';ctx.shadowBlur=size*.35;
  ctx.fillStyle=g;ctx.fillText(txt,0,0);
    ctx.restore();
}
function plainText(txt,x,y,size,weight,color,alpha,spacing){
  if(alpha<=0)return;
  ctx.save();ctx.globalAlpha=alpha;ctx.font=`${weight} ${size}px NSerif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.letterSpacing=(spacing||0)+'px';
  ctx.shadowColor='rgba(0,0,20,0.8)';ctx.shadowBlur=12;ctx.fillStyle=color;ctx.fillText(txt,x,y);ctx.restore();
}
function texts(t){
  const title='中秋節快樂',n=title.length,size=150,step=178;
  for(let i=0;i<n;i++){
    const p=prog(t,3.0+i*0.2,3.0+i*0.2+0.8);
    const x=540+(i-(n-1)/2)*step, y=1110+(1-eOut(p))*60;
    goldText(title[i],x,y,size,900,eOut(p),0.6+0.4*eBack(p),0);
  }
  // sheen sweep across title
  const sp=prog(t,4.6,5.6);
  if(sp>0&&sp<1){
    const oc=sheenC,oc2=oc.getContext('2d');oc2.clearRect(0,0,W,240);
    oc2.globalCompositeOperation='source-over';oc2.font='900 150px NSerif';oc2.textAlign='center';oc2.textBaseline='middle';oc2.fillStyle='#fff';
    for(let i=0;i<n;i++)oc2.fillText(title[i],540+(i-(n-1)/2)*step,120);
    oc2.globalCompositeOperation='source-in';
    const sx=-100+sp*1280,g=oc2.createLinearGradient(sx-110,0,sx+110,0);
    g.addColorStop(0,'rgba(255,255,255,0)');g.addColorStop(.5,'rgba(255,250,225,0.85)');g.addColorStop(1,'rgba(255,255,255,0)');
    oc2.fillStyle=g;oc2.fillRect(0,0,W,240);
    ctx.save();ctx.globalCompositeOperation='lighter';ctx.drawImage(oc,0,1110-120);ctx.restore();
  }
  // divider
  const dp=eInOut(prog(t,4.5,5.4));
  if(dp>0){ctx.save();ctx.strokeStyle='rgba(245,200,101,0.8)';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(540-300*dp,1225);ctx.lineTo(540-30*dp,1225);ctx.moveTo(540+30*dp,1225);ctx.lineTo(540+300*dp,1225);ctx.stroke();
    ctx.fillStyle='#f5c865';ctx.globalAlpha=dp;ctx.translate(540,1225);ctx.rotate(Math.PI/4);ctx.fillRect(-7,-7,14,14);ctx.restore();}
  const s1=eOut(prog(t,5.0,6.0));
  goldText('月圓 · 人團圓',540,1310+(1-s1)*30,70,900,s1,1,14);
  const s2=eOut(prog(t,6.2,7.2));
  plainText('願你與所愛的人，共賞一輪明月',540,1410+(1-s2)*24,44,500,'#fdf1d6',s2,6);
  const s3=eOut(prog(t,7.0,7.9));
  plainText('2026 · 09 · 25',540,1480,34,500,'#f5c865',s3*0.9,10);
  const s4=eOut(prog(t,8.0,9.0));
  plainText('湛智 AI 企業教練 · 棍子 Bryce Lin',540,1800,36,500,'#fdf1d6',s4,4);
  plainText('Made with Claude Opus 5.5',540,1855,26,500,'#c9b98f',s4*0.85,3);
}
function render(t){
  ctx.clearRect(0,0,W,H);
  sky(t);clouds(t);moon(t);
  for(const L of lanterns)if(L.sz<0.6)lantern(L,t);
  hills(t);
  for(const L of lanterns)if(L.sz>=0.6)lantern(L,t);
  petalsDraw(t);branch(t);
  // bottom vignette for brand legibility
  const vg=ctx.createLinearGradient(0,1700,0,H);vg.addColorStop(0,'rgba(2,4,15,0)');vg.addColorStop(1,'rgba(2,4,15,0.7)');ctx.fillStyle=vg;ctx.fillRect(0,1700,W,220);
  texts(t);
  // fade in from black
  const fi=1-prog(t,0,0.6);if(fi>0){ctx.fillStyle=`rgba(0,0,0,${fi})`;ctx.fillRect(0,0,W,H);}
}
window.renderFrame=render;window.DUR=DUR;
})();
</script>
